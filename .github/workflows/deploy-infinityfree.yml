# Deploys the PHP build to InfinityFree over FTP on every push to php-port (or by hand from the Actions tab).
# Needs three repository secrets (Settings > Secrets and variables > Actions):
#   FTP_SERVER    e.g. ftpupload.net
#   FTP_USERNAME  e.g. if0_12345678
#   FTP_PASSWORD  the hosting account (vPanel) password
# Only changed files are uploaded. config.php, uploads/ and installed.lock on the server are never touched,
# and install.php is never deployed. One-time scripts (like convert-omr.php) still have to be opened by hand.
name: Deploy to InfinityFree

on:
  push:
    branches: [php-port]
    paths: ['public/**', 'php/**', '.github/workflows/deploy-infinityfree.yml']
  workflow_dispatch:

concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build dist/htdocs
        run: node php/tools/dist.mjs
      - name: Upload changed files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/htdocs/
          server-dir: htdocs/
          exclude: |
            **/.git*
            **/.git*/**
            install.php
