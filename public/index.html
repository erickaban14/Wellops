<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d4e5f">
  <title>ProStars ERP</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app"><div class="boot">Loading ProStars ERP…</div></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
  <script>
    // If the host's browser check replaced a script, the app never starts: reload (at most once a minute) to pass the check.
    setTimeout(function () {
      if (window.__booted) return;
      var last = 0; try { last = +sessionStorage.getItem('wo_boot') || 0; } catch (e) {}
      if (Date.now() - last < 60000) return;
      try { sessionStorage.setItem('wo_boot', String(Date.now())); } catch (e) {}
      location.reload();
    }, 8000);
  </script>
</body>
</html>
